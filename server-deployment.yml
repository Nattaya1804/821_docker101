apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: service
  template:
    metadata:
      name: service-pods
      labels:
        app: service
    spec:
      containers:
        - name: service
          image: imsuriyapi/todo-api:v5
---
apiVersion: v1
kind: Service
metadata:
  name: service-service
spec:
  type: NodePort
  selector:
    app: service
  ports: 
    - port: 80
      targetPort: 80
      nodePort: 30002